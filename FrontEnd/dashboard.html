<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="icon" type="image/png" href="img/IMG_3840.PNG">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            padding: 40px 20px;
            background: linear-gradient(135deg, #e0f2f1 0%, #bbdefb 100%);
            color: #2c3e50;
            min-height: 100vh;
        }

        h2 {
            text-align: center;
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 30px;
            color: #1a365d;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.05);
            letter-spacing: -0.5px;
        }

        .table-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th,
        td {
            padding: 16px 20px;
            text-align: left;
            vertical-align: middle;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }

        th {
            background: linear-gradient(135deg, #2b5876, #4e4376);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.8px;
        }

        tbody tr {
            transition: all 0.3s ease;
        }

        tbody tr:hover {
            background-color: rgba(43, 88, 118, 0.04);
            transform: scale(1.005);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            z-index: 10;
            position: relative;
        }

        .status-select {
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid transparent;
            outline: none;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            font-size: 13px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .status-select:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Status Colors - Vibrant and Engaging */
        .status-Pending {
            background: #fff3e0;
            color: #e65100;
            border-color: #ffb74d;
        }

        .status-ConfirmOrder {
            background: #e3f2fd;
            color: #1565c0;
            border-color: #64b5f6;
        }

        .status-Ordered {
            background: #f3e5f5;
            color: #6a1b9a;
            border-color: #ba68c8;
        }

        .status-InChina {
            background: #e0f2f1;
            color: #00695c;
            border-color: #4db6ac;
        }

        .status-ArrivedKhmer {
            background: #e8f5e9;
            color: #2e7d32;
            border-color: #81c784;
        }

        .status-WillBeSend {
            background: #fff8e1;
            color: #f57f17;
            border-color: #ffd54f;
        }

        .status-Cancelled {
            background: #ffebee;
            color: #c62828;
            border-color: #e57373;
        }

        .btn-delete {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 10px rgba(255, 65, 108, 0.3);
        }

        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 65, 108, 0.4);
        }

        .item-list div {
            margin-bottom: 4px;
            color: #4a5568;
            font-size: 14px;
        }

        /* Links */
        a {
            color: #3182ce;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #2b6cb0;
            text-decoration: underline;
        }
        /* Tabs */
        .dashboard-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .dash-tab {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            font-family: 'Inter', sans-serif;
        }

        .dash-tab:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
        }

        .dash-tab.active {
            background: linear-gradient(135deg, #2b5876, #4e4376);
            color: white;
            box-shadow: 0 6px 12px rgba(43, 88, 118, 0.3);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* User Profile Card */
        .user-profile-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        .user-avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #3498db, #8e44ad);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 800;
            margin: 0 auto 20px;
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.3);
        }

        .user-info-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .user-info-row:last-child {
            border-bottom: none;
        }

        .user-info-label {
            font-weight: 600;
            color: #7f8c8d;
            font-size: 14px;
        }

        .user-info-value {
            font-weight: 700;
            color: #2c3e50;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <h2>Admin Dashboard</h2>

    <div class="dashboard-tabs">
        <button class="dash-tab active" id="tab-orders" onclick="switchTab('orders')">📦 Admin Order Dashboard</button>
        <button class="dash-tab" id="tab-user" onclick="switchTab('user')">👥 All Users</button>
    </div>

    <!-- ORDERS TAB -->
    <div id="section-orders" class="tab-content active">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>User ID</th>
                        <th>Date & Time</th>
                        <th>Customer</th>
                        <th>Phone</th>
                        <th>Delivery Address</th>
                        <th>Items Ordered</th>
                        <th>Note</th>
                        <th>Total</th>
                        <th>Receipt</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="order-list">
                    <tr>
                        <td colspan="12" style="text-align:center;">Loading orders...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ALL USERS TAB -->
    <div id="section-user" class="tab-content">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Registration Date</th>
                    </tr>
                </thead>
                <tbody id="user-list">
                    <tr>
                        <td colspan="4" style="text-align:center;">Loading users...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const ORDER_API_URL = CONFIG.API_BASE + '/order';
        const USER_API_URL = CONFIG.API_BASE + '/user';

        // ============================
        // TABS AND USER INFO
        // ============================
        function switchTab(tabName) {
            document.getElementById('tab-orders').classList.remove('active');
            document.getElementById('tab-user').classList.remove('active');
            document.getElementById('section-orders').classList.remove('active');
            document.getElementById('section-user').classList.remove('active');

            if (tabName === 'orders') {
                document.getElementById('tab-orders').classList.add('active');
                document.getElementById('section-orders').classList.add('active');
            } else if (tabName === 'user') {
                document.getElementById('tab-user').classList.add('active');
                document.getElementById('section-user').classList.add('active');
            }
        }

        async function fetchUsers() {
            try {
                const response = await fetch(USER_API_URL);
                const result = await response.json();
                if (result.status === 'success') {
                    renderUserTable(result.users);
                } else {
                    document.getElementById('user-list').innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">${result.message || 'Error loading users'}</td></tr>`;
                }
            } catch (error) {
                console.error("Error fetching users", error);
                document.getElementById('user-list').innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">Connection error</td></tr>`;
            }
        }

        function renderUserTable(users) {
            const tbody = document.getElementById('user-list');
            tbody.innerHTML = '';
            
            if (!users || users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No users found.</td></tr>';
                return;
            }

            users.slice().reverse().forEach(user => {
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: bold; color: #2ecc71;">${user.userId || '-'}</td>
                        <td style="font-weight: bold; color: #2c3e50;">${user.username || '-'}</td>
                        <td style="color: #3498db;">${user.email || '-'}</td>
                        <td style="font-size: 13px; color: #555;">${user.registerDate || '-'}</td>
                    </tr>
                `;
            });
        }

        // ============================
        // Helper: Open receipt in a new tab safely (handles base64 data URIs)
        // ============================
        function viewReceipt(receiptBase64) {
            if (!receiptBase64 || receiptBase64 === 'No Receipt') {
                alert('No receipt image available.');
                return;
            }
            try {
                const newTab = window.open();
                if (!newTab) {
                    alert('Popup blocked! Please allow popups to view the payment receipt.');
                    return;
                }
                newTab.document.write(
                    '<html>' +
                    '<head><title>Payment Receipt<\/title><\/head>' +
                    '<body style="margin:0; display:flex; justify-content:center; align-items:center; background:#1e1e24; min-height:100vh;">' +
                    '<img src="' + receiptBase64 + '" style="max-width:90%; max-height:90vh; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.5); object-fit:contain;" \/>' +
                    '<\/body>' +
                    '<\/html>'
                );
            } catch (e) {
                alert('Failed to open receipt image.');
            }
        }

        // ============================
        // ORDERS LOGIC
        // ============================
        async function fetchOrders() {
            try {
                const response = await fetch(ORDER_API_URL);
                const orders = await response.json();
                renderTable(orders);
            } catch (error) {
                console.error("Error fetching data", error);
            }
        }

        function renderTable(ordersData) {
            const tbody = document.getElementById('order-list');
            tbody.innerHTML = '';

            const orders = Array.isArray(ordersData) 
                ? ordersData 
                : (ordersData && Array.isArray(ordersData.data) ? ordersData.data : []);

            orders.slice().reverse().forEach(order => {
                let statusVal = order.status || 'Pending';

                // Map status to class name
                let statusClass = 'status-Pending';
                if (statusVal === 'Confirm order') statusClass = 'status-ConfirmOrder';
                if (statusVal === 'Ordered') statusClass = 'status-Ordered';
                if (statusVal === 'In China') statusClass = 'status-InChina';
                if (statusVal === 'Arrived Khmer') statusClass = 'status-ArrivedKhmer';
                if (statusVal === 'Will be send to you') statusClass = 'status-WillBeSend';
                if (statusVal === 'Cancelled') statusClass = 'status-Cancelled';

                const statusDropdown = `
                    <select class="status-select ${statusClass}" onchange="changeStatus('${order.orderId}', this.value)">
                        <option value="Pending" ${statusVal === 'Pending' ? 'selected' : ''}>Pending</option>
                        <option value="Confirm order" ${statusVal === 'Confirm order' ? 'selected' : ''}>Confirm order</option>
                        <option value="Ordered" ${statusVal === 'Ordered' ? 'selected' : ''}>Ordered</option>
                        <option value="In China" ${statusVal === 'In China' ? 'selected' : ''}>In China</option>
                        <option value="Arrived Khmer" ${statusVal === 'Arrived Khmer' ? 'selected' : ''}>Arrived Khmer</option>
                        <option value="Will be send to you" ${statusVal === 'Will be send to you' ? 'selected' : ''}>Will be send to you</option>
                        <option value="Cancelled" ${statusVal === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                    </select>
                `;

                const deleteBtn = `<button class="btn-delete" onclick="deleteOrder('${order.orderId}')">Delete</button>`;

                const receiptLink = order.receipt !== 'No Receipt'
                    ? `<a href="#" onclick="viewReceipt(\`${order.receipt}\`); return false;" style="color: #3498db; text-decoration: none; font-weight: bold;">View</a>`
                    : 'None';

                const addressDisplay = order.address && order.address.startsWith('http')
                    ? `<a href="${order.address}" target="_blank" style="color:#3498db; font-weight:bold; text-decoration:none;">🗺️ View Map</a>`
                    : (order.address || 'No Address');

                let itemsDisplay = '';
                if (order.items) {
                    try {
                        const itemsArray = JSON.parse(order.items);
                        itemsDisplay = itemsArray.map(item => `<div>- ${item.name} <strong>(x${item.quantity})</strong></div>`).join('');
                    } catch (e) {
                        itemsDisplay = order.items;
                    }
                } else {
                    itemsDisplay = 'No items';
                }

                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: bold; color: #3498db;">${order.orderId || '-'}</td>
                        <td style="font-weight: bold; color: #2ecc71;">${order.userId || '-'}</td>
                        <td style="font-size: 13px; color: #555; white-space: nowrap;">${order.date || '-'}</td> 
                        <td>${order.name}</td>
                        <td>${order.phone}</td>
                        <td style="max-width: 200px; word-break: break-all;">${addressDisplay}</td> 
                        <td class="item-list">${itemsDisplay}</td>
                        <td style="color: #e67e22;">${order.note || '-'}</td> 
                        <td style="font-weight:bold; color:#e74c3c;">$${order.total}</td>
                        <td>${receiptLink}</td>
                        <td>${statusDropdown}</td>
                        <td>${deleteBtn}</td>
                    </tr>
                `;
            });
        }

        async function changeStatus(orderId, newStatus) {
            try {
                const response = await fetch(`${ORDER_API_URL}/${orderId}/status`, {
                    method: 'PUT',
                    body: JSON.stringify({ CurrentStatus: newStatus }),
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();
                if (result.status === 'success') {
                    fetchOrders();
                } else {
                    alert("Error updating status: " + (result.message || 'Unknown error'));
                }
            } catch (error) {
                alert("Error updating status.");
            }
        }

        async function deleteOrder(orderId) {
            if (!confirm("Are you sure you want to DELETE this order permanently?")) return;

            const password = prompt("Please enter the password to confirm deletion:");
            if (password !== "15102006") {
                alert("Incorrect password. Deletion cancelled.");
                return;
            }

            try {
                const response = await fetch(`${ORDER_API_URL}/${orderId}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                if (result.status === 'success') {
                    fetchOrders();
                } else {
                    alert("Error deleting order: " + (result.message || 'Unknown error'));
                }
            } catch (error) {
                alert("Error deleting order.");
            }
        }

        // Initialize Dashboard
        fetchOrders();
        fetchUsers();
    </script>
</body>

</html>
